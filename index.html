<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Grading TBS Internal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-6 px-4">

    <div class="max-w-2xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="bg-emerald-800 text-white p-5 rounded-2xl shadow-lg flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-wide">Grading TBS Internal</h1>
                <p class="text-xs text-emerald-200 mt-1">Form Inspeksi & Kalkulator Sampel</p>
            </div>
            <span class="bg-emerald-700 text-emerald-100 text-xs px-3 py-1 rounded-full font-semibold border border-emerald-600">
                Cloud Synced
            </span>
        </div>

        <!-- Form Input -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
            <h2 class="text-md font-semibold text-slate-800 border-b pb-2">Detail Pengiriman & Sampel</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Tanggal -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Tanggal Inspeksi</label>
                    <input type="date" id="inputTanggal" class="w-full text-sm border-slate-300 rounded-lg p-2.5 bg-slate-50 border focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <!-- AFD -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Afdeling (AFD)</label>
                    <input type="text" id="inputAfd" placeholder="Contoh: AFD I" class="w-full text-sm border-slate-300 rounded-lg p-2.5 bg-slate-50 border focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <!-- Nama Driver -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Nama Driver</label>
                    <input type="text" id="inputDriver" placeholder="Nama Supir" class="w-full text-sm border-slate-300 rounded-lg p-2.5 bg-slate-50 border focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <!-- No Pol -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">No. Polisi (Plat)</label>
                    <input type="text" id="inputNopol" placeholder="BK 1234 XX" class="w-full text-sm border-slate-300 rounded-lg p-2.5 bg-slate-50 border focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <!-- Tonase Netto -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Tonase Netto (Kg)</label>
                    <input type="number" id="inputNetto" placeholder="0" class="w-full text-sm border-slate-300 rounded-lg p-2.5 bg-slate-50 border focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <!-- Rit Ke -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Rit Ke-</label>
                    <input type="number" id="inputRit" placeholder="1" class="w-full text-sm border-slate-300 rounded-lg p-2.5 bg-slate-50 border focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <!-- Jjg KAB -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Jjg KAB</label>
                    <input type="number" id="inputKab" placeholder="0" class="w-full text-sm border-slate-300 rounded-lg p-2.5 bg-slate-50 border focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <!-- Jjg PAB -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Jjg PAB</label>
                    <input type="number" id="inputPab" placeholder="0" class="w-full text-sm border-slate-300 rounded-lg p-2.5 bg-slate-50 border focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
            </div>

            <!-- Custom Input Photo: Kamera & Galeri File -->
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-2">Foto Bukti Inspeksi</label>
                
                <!-- Hidden Input -->
                <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
                <input type="file" id="galleryInput" accept="image/*" class="hidden">

                <!-- Tombol Buka Kamera / Pilih File -->
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="document.getElementById('cameraInput').click()" class="flex justify-center items-center gap-2 py-2.5 px-3 bg-emerald-50 hover:bg-emerald-100 border border-emerald-300 text-emerald-800 text-xs font-semibold rounded-lg transition-all">
                        📷 Buka Kamera
                    </button>
                    <button type="button" onclick="document.getElementById('galleryInput').click()" class="flex justify-center items-center gap-2 py-2.5 px-3 bg-slate-50 hover:bg-slate-100 border border-slate-300 text-slate-700 text-xs font-semibold rounded-lg transition-all">
                        📁 Pilih File / Galeri
                    </button>
                </div>

                <!-- Preview Input Form -->
                <div id="formPreviewContainer" class="mt-3 hidden flex items-center gap-3 bg-slate-50 p-2 rounded-lg border">
                    <img id="formImgPreview" class="h-16 w-16 rounded-md object-cover border">
                    <div class="text-xs text-slate-600">
                        <p id="fileNameText" class="font-medium text-slate-800 truncate max-w-[200px]">Foto terpilih</p>
                        <button type="button" onclick="clearSelectedPhoto()" class="text-red-500 hover:underline mt-1">Hapus Foto</button>
                    </div>
                </div>
            </div>

            <h2 class="text-md font-semibold text-slate-800 border-b pb-2 pt-2">Data Sampel & Kategori Fruit</h2>

            <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                <!-- Jumlah Sampel -->
                <div class="col-span-2 md:col-span-3">
                    <label class="block text-xs font-semibold text-emerald-800 mb-1">Jumlah Sampel (Jjg)</label>
                    <input type="number" id="inputJmlSampel" value="100" class="w-full text-sm border-emerald-400 bg-emerald-50/50 rounded-lg p-2.5 border font-bold text-emerald-900 focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <!-- Input Rincian Grading -->
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">BM (Jjg)</label>
                    <input type="number" id="inputBm" placeholder="0" class="w-full text-sm border-slate-300 rounded-lg p-2 bg-slate-50 border outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">BB (Jjg)</label>
                    <input type="number" id="inputBb" placeholder="0" class="w-full text-sm border-slate-300 rounded-lg p-2 bg-slate-50 border outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">TP (Jjg)</label>
                    <input type="number" id="inputTp" placeholder="0" class="w-full text-sm border-slate-300 rounded-lg p-2 bg-slate-50 border outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Jjg Kosong</label>
                    <input type="number" id="inputJk" placeholder="0" class="w-full text-sm border-slate-300 rounded-lg p-2 bg-slate-50 border outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Parteno (Jjg)</label>
                    <input type="number" id="inputParteno" placeholder="0" class="w-full text-sm border-slate-300 rounded-lg p-2 bg-slate-50 border outline-none">
                </div>
            </div>

            <!-- Tombol Generate -->
            <button id="btnGenerate" onclick="generateReport()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition-all flex justify-center items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                Generate & Simpan Laporan
            </button>
        </div>

        <!-- Output Result Section -->
        <div id="outputContainer" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <h2 class="text-md font-semibold text-slate-800 border-b pb-2">Hasil Respon Laporan</h2>

            <!-- Output Gambar Bukti -->
            <div id="outputImageWrapper" class="hidden space-y-1">
                <p class="text-xs font-medium text-slate-500">Foto Bukti Inspeksi:</p>
                <img id="outputImg" class="w-full max-h-72 object-cover rounded-xl border border-slate-200">
            </div>

            <!-- Output Teks Laporan -->
            <div class="bg-slate-900 text-emerald-400 p-4 rounded-xl font-mono text-sm whitespace-pre-wrap leading-relaxed shadow-inner" id="outputText"></div>

            <!-- Tombol Kirim / Copy WhatsApp -->
            <div class="space-y-2">
                <button onclick="shareToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition-all flex justify-center items-center gap-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
                    Bagikan Gambar + Teks ke WhatsApp
                </button>

                <button onclick="copyToWhatsAppTextOnly()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2.5 px-4 rounded-xl transition-all text-xs flex justify-center items-center gap-2 border">
                    📋 Salin Teks Laporan Saja
                </button>
            </div>
        </div>

        <!-- Footer Copyright -->
        <footer class="text-center py-4 text-xs text-slate-500 font-medium border-t border-slate-200/60 mt-8">
            <p>Copyright 2026 Supriyanto</p>
        </footer>

    </div>

    <!-- Script Firebase SDK (v10 JS Module) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfigurasi asli Firebase milik Anda (data-grading)
        const firebaseConfig = {
            apiKey: "AIzaSyDnCPpQQZ8OIpCXXL_-59jFisoNq0LOSaY",
            authDomain: "data-grading.firebaseapp.com",
            projectId: "data-grading",
            storageBucket: "data-grading.firebasestorage.app",
            messagingSenderId: "686122981487",
            appId: "1:686122981487:web:d6b56b40412f41fedd959a",
            measurementId: "G-31FRYTF9RT"
        };

        // Inisialisasi Firebase & Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Set default tanggal hari ini
        document.getElementById('inputTanggal').valueAsDate = new Date();

        let selectedFile = null;
        let rawTextWhatsApp = "";

        // Handle File Selection
        document.getElementById('cameraInput').addEventListener('change', (e) => handleFileSelect(e.target.files[0]));
        document.getElementById('galleryInput').addEventListener('change', (e) => handleFileSelect(e.target.files[0]));

        function handleFileSelect(file) {
            if (file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = function(evt) {
                    document.getElementById('formImgPreview').src = evt.target.result;
                    document.getElementById('fileNameText').innerText = file.name;
                    document.getElementById('formPreviewContainer').classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        window.clearSelectedPhoto = function() {
            selectedFile = null;
            document.getElementById('cameraInput').value = "";
            document.getElementById('galleryInput').value = "";
            document.getElementById('formPreviewContainer').classList.add('hidden');
        }

        function formatPercent(val, total) {
            if (!val || val == 0 || !total || total == 0) return "-(%)";
            const count = parseFloat(val);
            const tot = parseFloat(total);
            const pct = (count / tot) * 100;
            return `${count}(${pct.toFixed(2).replace('.', ',')}%)`;
        }

        function formatTanggalIndo(dateString) {
            if (!dateString) return "-";
            const date = new Date(dateString);
            const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            return date.toLocaleDateString('id-ID', options);
        }

        // FUNGSI SIMPAN KE FIREBASE
        window.generateReport = async function() {
            const btnGenerate = document.getElementById('btnGenerate');
            btnGenerate.disabled = true;
            btnGenerate.innerText = "Menyimpan ke Cloud Firebase...";

            const tanggal = document.getElementById('inputTanggal').value;
            const tglFormatted = formatTanggalIndo(tanggal);
            const jmlSampel = Number(document.getElementById('inputJmlSampel').value) || 100;
            
            const afd = document.getElementById('inputAfd').value || '-';
            const driver = document.getElementById('inputDriver').value || '-';
            const nopol = document.getElementById('inputNopol').value || '-';
            const netto = Number(document.getElementById('inputNetto').value) || 0;
            const kab = Number(document.getElementById('inputKab').value) || 0;
            const pab = Number(document.getElementById('inputPab').value) || 0;
            const rit = Number(document.getElementById('inputRit').value) || 0;

            const bm = Number(document.getElementById('inputBm').value) || 0;
            const bb = Number(document.getElementById('inputBb').value) || 0;
            const tp = Number(document.getElementById('inputTp').value) || 0;
            const jk = Number(document.getElementById('inputJk').value) || 0;
            const parteno = Number(document.getElementById('inputParteno').value) || 0;

            // 1. Simpan Data Teks ke Firestore Collection 'grading_tbs'
            try {
                const docRef = await addDoc(collection(db, "grading_tbs"), {
                    tanggal: tanggal,
                    afd: afd,
                    driver: driver,
                    nopol: nopol,
                    netto: netto,
                    rit: rit,
                    kab: kab,
                    pab: pab,
                    jmlSampel: jmlSampel,
                    bm: bm,
                    bb: bb,
                    tp: tp,
                    jk: jk,
                    parteno: parteno,
                    createdAt: serverTimestamp() // Waktu tersimpan otomatis
                });

                console.log("Data berhasil disimpan ke Firebase ID: ", docRef.id);
            } catch (e) {
                console.error("Gagal menyimpan ke Firebase: ", e);
                alert("Gagal menyimpan data ke Firebase Database. Pastikan Firestore sudah dibuat dalam Test Mode.");
            } finally {
                btnGenerate.disabled = false;
                btnGenerate.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg> Generate & Simpan Laporan`;
            }

            // 2. Tampilkan Hasil Respon UI & WA
            const nettoFormatted = netto ? netto.toLocaleString('id-ID') : '-';

            rawTextWhatsApp = 
`Grading Sampel ${jmlSampel}jjg
Tanggal (${tglFormatted})

AFD : ${afd}
Nama Driver : ${driver}
No pol : ${nopol}
Tonase netto : ${nettoFormatted}
Jjg KAB: ${kab}
Rit ke : ${rit}

Jjg PAB : ${pab}
BM :${formatPercent(bm, jmlSampel)}
BB  :${formatPercent(bb, jmlSampel)}
TP  :${formatPercent(tp, jmlSampel)}
Jjg kosong :${formatPercent(jk, jmlSampel)}
Parteno :${formatPercent(parteno, jmlSampel)}`;

            document.getElementById('outputText').innerText = rawTextWhatsApp;

            const outputImgWrapper = document.getElementById('outputImageWrapper');
            const outputImg = document.getElementById('outputImg');

            if (selectedFile) {
                outputImg.src = URL.createObjectURL(selectedFile);
                outputImgWrapper.classList.remove('hidden');
            } else {
                outputImgWrapper.classList.add('hidden');
            }

            document.getElementById('outputContainer').classList.remove('hidden');
            document.getElementById('outputContainer').scrollIntoView({ behavior: 'smooth' });
        }

        window.shareToWhatsApp = async function() {
            if (!rawTextWhatsApp) return;
            if (selectedFile && navigator.canShare && navigator.canShare({ files: [selectedFile] })) {
                try {
                    await navigator.share({ files: [selectedFile], title: 'Grading TBS Internal', text: rawTextWhatsApp });
                } catch (err) {
                    if (err.name !== 'AbortError') fallbackCopyText();
                }
            } else if (navigator.share) {
                try {
                    await navigator.share({ title: 'Grading TBS Internal', text: rawTextWhatsApp });
                } catch (err) {
                    fallbackCopyText();
                }
            } else {
                fallbackCopyText();
            }
        }

        window.copyToWhatsAppTextOnly = function() {
            if (!rawTextWhatsApp) return;
            navigator.clipboard.writeText(rawTextWhatsApp).then(() => {
                alert("Teks laporan berhasil disalin!");
            });
        }

        function fallbackCopyText() {
            navigator.clipboard.writeText(rawTextWhatsApp).then(() => {
                alert("Teks disalin! Silakan tempel teks ke WhatsApp.");
            });
        }
    </script>
</body>
</html>
